# E1 v7 — closed-source extractor ablation.
# Replaces only the Extractor with GPT-4o (2024-11-20); Critic and
# Consolidator stay on Llama 3.3 70B Instruct (same as default open-weights).
# OpenRouter pricing for gpt-4o-2024-11-20: $2.50/M input, $10.00/M output.

extractor:
  model_id: "openai/gpt-4o-2024-11-20"
  price_in_per_m: 2.50
  price_out_per_m: 10.00
  temperatures: [0.0, 0.3, 0.7]
  max_tokens: 4000
  top_p: 0.95

critic:
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 8000
  top_p: 0.95

consolidator:
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 4000
  top_p: 0.95

defaults:
  request_timeout_s: 240
  max_retries: 4
  retry_backoff_s: 2.0

concurrency:
  papers_in_flight: 5
  per_provider_max: 5
