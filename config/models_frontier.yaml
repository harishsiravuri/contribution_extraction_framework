# Frontier-extractor ablation. Replaces only the Extractor; Critic and
# Consolidator stay on Llama for cost. Use on small benchmark subsets only —
# Opus is ~25× the input price of DeepSeek.
#
# If the model_id 404s, swap for "openai/gpt-5" or another frontier model
# available on OpenRouter at run time.

extractor:
  model_id: "anthropic/claude-opus-4.6"
  price_in_per_m: 15.0
  price_out_per_m: 75.0
  temperatures: [0.0, 0.3, 0.7]
  max_tokens: 4000
  top_p: 0.95

critic:
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 8000
  top_p: 0.95

consolidator:
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 4000
  top_p: 0.95

defaults:
  request_timeout_s: 120
  max_retries: 4
  retry_backoff_s: 2.0

concurrency:
  papers_in_flight: 10
  per_provider_max: 5
