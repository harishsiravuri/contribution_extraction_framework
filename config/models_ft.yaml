# Fine-tuned-extractor config. Replaces ONLY the Extractor model with the
# SciREX-fine-tuned Llama 3.1 8B from Together AI; Critic and Consolidator
# remain on Llama 3.3 70B via OpenRouter.
#
# IMPORTANT: extractor.model_id is filled in after the Together fine-tune job
# completes. Until then, use models.yaml for unchanged extractor.

extractor:
  # Fill this in from outputs/paper_data_v5/finetune_meta.json finetuned_model
  model_id: "harishsiravuri_e088/Meta-Llama-3.1-8B-Instruct-Reference-scirex-6cf047e5-05725653"
  price_in_per_m: 0.20
  price_out_per_m: 0.20
  temperatures: [0.0, 0.3, 0.7]
  max_tokens: 4000
  top_p: 0.95

critic:
  # Same as production multi-agent: Llama 3.3 70B via OpenRouter
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 8000
  top_p: 0.95

consolidator:
  model_id: "meta-llama/llama-3.3-70b-instruct"
  price_in_per_m: 0.59
  price_out_per_m: 0.79
  temperature: 0.0
  max_tokens: 4000
  top_p: 0.95

defaults:
  request_timeout_s: 180
  max_retries: 4
  retry_backoff_s: 2.0

concurrency:
  papers_in_flight: 10
  per_provider_max: 5
